
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <h1>Login</h1>

    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">

    <button class="primary-btn" id="loginBtn">
      Login
    </button>

    <button class="guest-btn" id="guestBtn">
      Use as Guest
    </button>

    <button class="secondary-btn" id="resetBtn">
      Reset Password
    </button>

    <a href="signup.html" class="secondary-btn">
      Create Account
    </a>
  </div>
</div>

<script type="module" src="auth.js"></script>
</body>
</html>
